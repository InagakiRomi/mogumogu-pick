spring:
  application:
    name: mogumogu

  config:
    import: "optional:file:.env[.properties]"

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:h2}

  datasource:
    url: "jdbc:h2:file:./data/mogumogu;MODE=MySQL;DATABASE_TO_LOWER=TRUE"
    username: sa
    password: ""

  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: create-drop

  flyway:
    enabled: false

  sql:
    init:
      mode: always
      data-locations: classpath:sql/*.sql

  jackson:
    date-format: "yyyy-MM-dd HH:mm:ss"
    time-zone: Asia/Taipei

  web:
    error:
      include-stacktrace: never

jwt:
  secret: ${JWT_SECRET}
  ttl: ${JWT_TTL}

admin:
  username: ${ADMIN_USERNAME:}
  email: ${ADMIN_EMAIL:}
  password: ${ADMIN_PASSWORD:}
